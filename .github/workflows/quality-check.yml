name: Quality Check

on:
  # main への直 push / 管理者マージでも走らせる。pull_request だけだと、
  # その経路が素通りしたまま deploy-pages.yml が公開してしまう
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint & Type Check
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create .npmrc for pnpm hoisting
        run: |
          echo "auto-install-peers=true" > .npmrc
          echo "public-hoist-pattern[]=*types*" >> .npmrc
          echo "public-hoist-pattern[]=prop-types" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: false

      # DS コア層が UI ライブラリに依存していないこと。
      # ESLint はファイル単位でしか見ないので、コア外を 1 枚挟んだ経路
      # (core → helper → @mui) を素通りさせる。こちらは依存グラフを辿る。
      - name: Check DS core has no UI-library dependency
        run: pnpm check:ds-core

      # design-tokens/tokens.json は src/themes と story から生成する派生物。
      # 外部（他フレームワークのプロダクト）が参照する唯一の機械可読な入口
      # なので、古いまま配ると相手は黙って古い値を掴む。
      # 実際 StatCard / EmptyState を DS に足したときに再生成が漏れていた。
      - name: Check design tokens are up to date
        run: |
          pnpm export-tokens
          pnpm export-css
          if ! git diff --quiet design-tokens/; then
            echo "::error::design-tokens/ の生成物が古いです。pnpm export-tokens && pnpm export-css を実行してコミットしてください"
            git diff --stat design-tokens/
            exit 1
          fi

      - name: Check for console.log
        run: |
          echo "Checking for console.log remnants..."
          if grep -rn "console\.log" --include="*.ts" --include="*.tsx" src/ --exclude-dir=node_modules 2>/dev/null | grep -v "// eslint-disable" | grep -v ".stories." | head -20; then
            echo "Warning: console.log detected"
          fi

      - name: Check for any type
        run: |
          echo "Checking for 'any' type usage..."
          if grep -rn ": any" --include="*.ts" --include="*.tsx" src/ --exclude-dir=node_modules 2>/dev/null | grep -v "// eslint-disable" | head -20; then
            echo "Warning: 'any' type detected"
          fi

      # サンプルデータへの実在ブランド名の再混入を止める (#74)
      # 上の 2 つと違い警告では済ませない。公開後は履歴にも成果物にも残り、
      # 作業ツリーを直しても消えないため、入る前に落とす
      - name: Check for real brand names in sample data
        run: pnpm check:brand

  # Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create .npmrc for pnpm hoisting
        run: |
          echo "auto-install-peers=true" > .npmrc
          echo "public-hoist-pattern[]=*types*" >> .npmrc
          echo "public-hoist-pattern[]=prop-types" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:all
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Storybook Build Check
  storybook-build:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create .npmrc for pnpm hoisting
        run: |
          echo "auto-install-peers=true" > .npmrc
          echo "public-hoist-pattern[]=*types*" >> .npmrc
          echo "public-hoist-pattern[]=prop-types" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      # preview.tsx は axe の自動実行を切っている（開発が重くなるため）。
      # パネルから手で押せば動くが CI では誰も押さないので、
      # ビルドした物を実際に描画して測る
      - name: Install Chromium for a11y check
        run: pnpm exec playwright install --with-deps chromium

      # design-tokens/kaze-tokens.css は MUI を入れないプロダクトが読む
      # 唯一の色の入口。詳細度と順序（スキーム属性とモード属性が同じ重み、
      # prefers-color-scheme と明示指定の優先関係）はソースを読んでも
      # 判定できないので、実ブラウザで computed value を測る
      - name: Check CSS variables resolve as intended
        run: pnpm check:css-vars

      # 配信と検査を 1 ステップにまとめる。
      # ステップをまたいで背景プロセスが生きている前提を持たない
      - name: Check contrast (rendered)
        run: |
          # 出力を捨てないと、背景プロセスがステップの stdout を掴んだままになり
          # ログ収集が EOF を待って終わらない（ローカル実行で実際に詰まった）。
          # 停止処理は置かない。非対話 bash では背景ジョブがスクリプト自身と
          # 同じプロセスグループに入るため、グループごと kill すると
          # ステップ自体が死ぬ（これもローカル実行で踏んだ）。
          # job の終了時にランナーごと片付くので放置してよい
          npx --yes http-server storybook-static -p 6099 --silent >/dev/null 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:6099/index.json; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Storybook を配信できませんでした"; exit 1
          fi
          pnpm check:a11y

  # Change Analysis
  change-analysis:
    name: Change Analysis
    runs-on: ubuntu-latest
    outputs:
      has_component_changes: ${{ steps.check.outputs.has_component_changes }}
      has_story_changes: ${{ steps.check.outputs.has_story_changes }}
      changed_files_count: ${{ steps.check.outputs.changed_files_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")

          if echo "$CHANGED_FILES" | grep -q "src/components/"; then
            echo "has_component_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_component_changes=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q "\.stories\."; then
            echo "has_story_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_story_changes=false" >> $GITHUB_OUTPUT
          fi

          CHANGED_COUNT=$(echo "$CHANGED_FILES" | grep -c "\.tsx\|\.ts") || CHANGED_COUNT=0
          echo "changed_files_count=$CHANGED_COUNT" >> $GITHUB_OUTPUT

          echo "Changed files:"
          echo "$CHANGED_FILES" | head -30

  # Quality Summary
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, storybook-build, change-analysis]
    if: always()
    steps:
      - name: Create summary
        env:
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SB_RESULT: ${{ needs.storybook-build.result }}
          HAS_COMPONENT: ${{ needs.change-analysis.outputs.has_component_changes }}
          HAS_STORY: ${{ needs.change-analysis.outputs.has_story_changes }}
          CHANGED_COUNT: ${{ needs.change-analysis.outputs.changed_files_count }}
        run: |
          echo "## Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${LINT_RESULT}" == "success" ]; then
            echo "- Lint & TypeCheck: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Lint & TypeCheck: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${TEST_RESULT}" == "success" ]; then
            echo "- Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Unit Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${SB_RESULT}" == "success" ]; then
            echo "- Storybook Build: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Storybook Build: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Change Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Component changes: ${HAS_COMPONENT}" >> $GITHUB_STEP_SUMMARY
          echo "- Storybook changes: ${HAS_STORY}" >> $GITHUB_STEP_SUMMARY
          echo "- Changed files count: ${CHANGED_COUNT}" >> $GITHUB_STEP_SUMMARY
