    <meta
      property="og:title"
      content="Kaze UX — AI エージェントに仕様を配るデザインシステム" />
    <meta
      property="og:description"
      content="トークン・部品仕様・禁止パターンを MCP で AI エージェントへ配り、守られているかを CI の検査で実測するデザインシステム。Storybook と 3 つのプロダクトデモを公開中。" />
    <meta
      property="og:image"
      content="https://kaze-ux.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
    <script>
      // GitHub Pages SPA Redirect Handler
      // Handle redirects from 404.html for client-side routing
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      })(window.location)
    </script>
    <script>
      // テーマ初期化（FOUC防止）- Reactレンダリング前に実行
      ;(function () {
        var savedMode =
          localStorage.getItem('mui-mode') || localStorage.getItem('theme-mode')
        var prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches
        var isDark =
          savedMode === 'dark' || (savedMode !== 'light' && prefersDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        document.documentElement.setAttribute(
          'data-theme',
          isDark ? 'dark' : 'light'
        )
      })()
    </script>
    <style>
      /* テーマ確定前の背景色を設定（FOUC防止） */
      html {
        background-color: #fff;
      }
      html.dark {
        background-color: #121212;
      }
      /* 初期ロード時のちらつき防止 */
      html:not(.dark):not([data-theme]) {
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
